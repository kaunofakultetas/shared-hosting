############################################################
#  [*] needrestart — never restart sysbox by itself
#
#  sysbox.service is a /bin/sh that ends in "sleep infinity",
#  so every libc, dash or coreutils upgrade leaves it running
#  an outdated binary and needrestart restarts it after
#  unattended-upgrades — and through PartOf= that restarts
#  sysbox-mgr and sysbox-fs too, under the running VMs. The
#  running VMs lose sysbox-fs's /proc and /sys emulation on
#  the spot, and sysbox-mgr forgets which rootfs upper layers
#  it chowned, so every VM restarted afterwards comes up with
#  its image owned by nobody (see fixContainers.sh). The libc
#  upgrade of 2026-11-14 06:24 did exactly that.
#
#  The sysbox binaries are statically linked, so skipping the
#  restart costs nothing. Restart sysbox by hand only while
#  every sysbox container is stopped, or reboot instead.
#  Docker is already excluded by needrestart's own defaults.
#
#  Installed as /etc/needrestart/conf.d/sysbox.conf.
############################################################


$nrconf{override_rc}{qr(^sysbox)} = 0;
